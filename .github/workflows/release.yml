name: release

# Publishes a production-signed, non-debuggable APK and a browser distribution.
# Requires ARIADNE_KEYSTORE_BASE64, ARIADNE_STORE_PASSWORD, ARIADNE_KEY_ALIAS,
# and ARIADNE_KEY_PASSWORD repository/environment secrets.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.0.0-rc1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build the signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ARIADNE_KEYSTORE_BASE64 }}
          ARIADNE_STORE_PASSWORD: ${{ secrets.ARIADNE_STORE_PASSWORD }}
          ARIADNE_KEY_ALIAS: ${{ secrets.ARIADNE_KEY_ALIAS }}
          ARIADNE_KEY_PASSWORD: ${{ secrets.ARIADNE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in KEYSTORE_BASE64 ARIADNE_STORE_PASSWORD ARIADNE_KEY_ALIAS ARIADNE_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then echo "::error::Missing release signing configuration: $key"; exit 1; fi
          done
          export ARIADNE_KEYSTORE_PATH="$RUNNER_TEMP/ariadne-release.keystore"
          trap 'rm -f "$ARIADNE_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ARIADNE_KEYSTORE_PATH"
          ./gradlew :app:android:assembleRelease --console=plain --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          shopt -s nullglob
          apks=(app/android/build/outputs/apk/release/*.apk)
          [ "${#apks[@]}" -eq 1 ] || { echo "Expected exactly one signed APK" >&2; exit 1; }
          cp "${apks[0]}" dist/ariadne.apk
          ls -l dist/ariadne.apk

      - name: Build the browser distribution
        run: ./gradlew :app:wasm:wasmJsBrowserDistribution --console=plain --stacktrace

      - name: Zip the browser build
        run: |
          cd app/wasm/build/dist/wasmJs/productionExecutable
          zip -qr "$GITHUB_WORKSPACE/dist/ariadne-web.zip" .

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          [[ "$TAG" =~ ^v[0-9][a-zA-Z0-9._-]*$ ]] || { echo "Invalid release tag" >&2; exit 1; }
          PRE=""
          case "$TAG" in
            *-rc*|*-beta*|*-alpha*) PRE="--prerelease" ;;
          esac
          NOTES=$(cat <<'EOF'
          `ariadne.apk` is a production-signed, non-debuggable release build.
          It does not include the debug-only mock glasses integration.

          `ariadne-web.zip` is the browser distribution — unzip it and serve the folder, or
          use the published demo at https://armystay.github.io/ariadne/ .

          Android rate requests disclose currency pairs and IP address to frankfurter.app.
          Android voice input uses a separate recognizer that may process audio remotely.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/ariadne.apk dist/ariadne-web.zip --clobber
          else
            gh release create "$TAG" dist/ariadne.apk dist/ariadne-web.zip \
              --target "$GITHUB_SHA" \
              --title "Ariadne $TAG" \
              --notes "$NOTES" \
              $PRE
          fi
