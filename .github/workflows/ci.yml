name: four targets

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared:
    name: shared tests (jvm + wasm + android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Documentation claims
        # No JDK, no Gradle, a second: every Route, hook, permission and path the docs
        # name has to exist. This is the gate that would have caught a share route that
        # was only ever a sentence.
        run: ./tools/claim-check.sh
      - name: Install Linux OCR natives (Tess4J)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libtesseract-dev libleptonica-dev
      - name: shared JVM tests
        run: |
          set -o pipefail
          ./gradlew jvmTest --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: android debug + wasm compile/distribution
        run: |
          set -o pipefail
          ./gradlew :app:android:assembleDebug :app:wasm:compileKotlinWasmJs :app:wasm:wasmJsBrowserDistribution --console=plain --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: compiler errors, as annotations
        # The run log is not always reachable (proxies, corporate networks, a reviewer
        # on a phone). Kotlin's compiler errors are the one thing worth reading in it,
        # so they are lifted out and posted as check-run annotations, which the API and
        # the PR page both serve.
        if: failure()
        run: |
          set -o pipefail
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            # Compiler diagnostics first, then the lines a failed test prints —
            # the two things that explain a red run without the log.
            grep -E "^(e|w): file:///" "$RUNNER_TEMP/build.log" | head -40 | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | sed 's|file:///home/runner/work/ariadne/ariadne/||')"
            done
            grep -E "FAILED|AssertionError|Expected|tests completed" "$RUNNER_TEMP/build.log" \
              | head -20 | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line")"
            done
          fi

  desktop:
    name: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install Linux OCR natives (Tess4J)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libtesseract-dev libleptonica-dev
      - name: desktop compile
        run: |
          set -o pipefail
          ./gradlew :app:desktop:compileKotlinJvm --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: compiler errors, as annotations
        # The run log is not always reachable (proxies, corporate networks, a reviewer
        # on a phone). Kotlin's compiler errors are the one thing worth reading in it,
        # so they are lifted out and posted as check-run annotations, which the API and
        # the PR page both serve.
        if: failure()
        run: |
          set -o pipefail
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            grep -E "^(e|w): file:///" "$RUNNER_TEMP/build.log" | head -60 | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | sed 's|file:///home/runner/work/ariadne/ariadne/||')"
            done
          fi

  ios:
    name: ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: ios compile
        run: |
          set -o pipefail
          ./gradlew :app:ios:compileKotlinIosSimulatorArm64 :app:ios:compileKotlinIosArm64 --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: compiler errors, as annotations
        # The run log is not always reachable (proxies, corporate networks, a reviewer
        # on a phone). Kotlin's compiler errors are the one thing worth reading in it,
        # so they are lifted out and posted as check-run annotations, which the API and
        # the PR page both serve.
        if: failure()
        run: |
          set -o pipefail
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            grep -E "^(e|w): file:///" "$RUNNER_TEMP/build.log" | head -60 | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | sed 's|file:///home/runner/work/ariadne/ariadne/||')"
            done
          fi
