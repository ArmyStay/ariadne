name: four targets

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: shared tests (jvm + wasm + android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: commonTest — parser, money, fx, queue, search, days
        run: ./gradlew jvmTest --console=plain
      - name: android + wasm compile
        run: ./gradlew :app:android:assembleDebug :app:wasm:compileKotlinWasmJs --console=plain

  desktop:
    name: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:desktop:compileKotlinJvm --console=plain

  ios:
    name: ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:ios:compileKotlinIosSimulatorArm64 --console=plain

  pages:
    name: wasm demo → GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [shared]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:wasm:wasmJsBrowserDistribution --console=plain
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/wasm/build/dist/wasmJs/productionExecutable
      - uses: actions/deploy-pages@v4
