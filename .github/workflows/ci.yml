name: four targets

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: shared tests (jvm + wasm + android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Linux OCR natives (Tess4J)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libtesseract-dev libleptonica-dev
      - name: shared JVM tests
        run: ./gradlew jvmTest --console=plain --stacktrace
      - name: android debug + wasm compile/distribution
        run: ./gradlew :app:android:assembleDebug :app:wasm:compileKotlinWasmJs :app:wasm:wasmJsBrowserDistribution --console=plain --stacktrace

  desktop:
    name: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Linux OCR natives (Tess4J)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libtesseract-dev libleptonica-dev
      - run: ./gradlew :app:desktop:compileKotlinJvm --console=plain --stacktrace

  ios:
    name: ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:ios:compileKotlinIosSimulatorArm64 :app:ios:compileKotlinIosArm64 --console=plain --stacktrace

  pages:
    name: wasm demo → GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [shared]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:wasm:wasmJsBrowserDistribution --console=plain --stacktrace
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/wasm/build/dist/wasmJs/productionExecutable
      - id: deployment
        uses: actions/deploy-pages@v4
