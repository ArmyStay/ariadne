name: probe
on:
  push:
    branches: [arena/3398d70f-ariadne]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: compile every target
        run: |
          set +e
          ./gradlew :app:android:assembleDebug --console=plain > /tmp/a.log 2>&1; a=$?
          ./gradlew :app:wasm:compileKotlinWasmJs --console=plain > /tmp/w.log 2>&1; w=$?
          ./gradlew :app:desktop:compileKotlinJvm --console=plain > /tmp/d.log 2>&1; d=$?
          ./gradlew jvmTest --console=plain > /tmp/j.log 2>&1; j=$?
          echo "::warning::EXIT android=$a wasm=$w desktop=$d jvm=$j"
          grep -hE "^e: " /tmp/a.log /tmp/w.log /tmp/d.log /tmp/j.log | head -18 | while IFS= read -r l; do
            echo "::error::$l"
          done
          grep -h -A4 "What went wrong" /tmp/a.log /tmp/w.log /tmp/d.log /tmp/j.log | head -8 | while IFS= read -r l; do
            echo "::error::W $l"
          done
          exit 0
