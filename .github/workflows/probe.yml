name: probe
# TEMPORARY - surfaces the compiler errors as check-run annotations. Deleted before
# the branch is final.

on:
  push:
    branches: [arena/3398d70f-ariadne]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: android, with the errors surfaced
        run: |
          set +e
          ./gradlew :app:android:assembleDebug --console=plain > /tmp/a.log 2>&1
          echo "::warning::ANDROID exit=$?"
          grep -E "^e: |What went wrong|FAILURE:|Could not|Caused by" /tmp/a.log | head -25 | while IFS= read -r l; do
            echo "::error::A $l"
          done
          exit 0
