name: probe
on:
  push:
    branches: [arena/3398d70f-ariadne]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: android debug
        run: |
          set +e
          ./gradlew :app:android:assembleDebug --console=plain > /tmp/a.log 2>&1
          echo "::warning::ANDROID exit=$?"
          grep -A8 "What went wrong" /tmp/a.log | head -14 | while IFS= read -r l; do
            echo "::error::A $l"
          done
          grep -E "^e: " /tmp/a.log | head -6 | while IFS= read -r l; do
            echo "::error::E $l"
          done
          exit 0
      - name: the SDK's own package
        run: |
          find ~/.gradle/caches/modules-2/files-2.1/com.meta.wearable -name '*.aar' 2>/dev/null | while read -r aar; do
            echo "::warning::AAR $(basename "$aar")"
            d=$(mktemp -d); unzip -q -o "$aar" classes.jar -d "$d" 2>/dev/null
            unzip -l "$d/classes.jar" 2>/dev/null | awk '{print $4}' \
              | grep -E '^com/meta/wearable/' | grep -vE '\$|proto|/internal/' \
              | head -18 | while IFS= read -r c; do echo "::warning::  $c"; done
            rm -rf "$d"
          done
