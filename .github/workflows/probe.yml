name: probe
on:
  push:
    branches: [arena/3398d70f-ariadne]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: android debug
        run: |
          set +e
          ./gradlew :app:android:assembleDebug --console=plain > /tmp/a.log 2>&1
          echo "::warning::ANDROID exit=$?"
          grep -A6 "What went wrong" /tmp/a.log | head -10 | while IFS= read -r l; do
            echo "::error::A $l"
          done
          exit 0
      - name: core api
        run: |
          find ~/.gradle/caches/modules-2/files-2.1/com.meta.wearable -name 'mwdat-core*.aar' | head -1 | while read -r aar; do
            d=$(mktemp -d); unzip -q -o "$aar" classes.jar -d "$d"
            unzip -l "$d/classes.jar" | awk '{print $4}' | grep -E '^com/meta/wearable/dat/core/' | grep -vE '\$|proto|/internal/' | head -20 | while IFS= read -r c; do echo "::warning::CORE $c"; done
            for cls in com.meta.wearable.dat.core.DeviceManager com.meta.wearable.dat.core.Session com.meta.wearable.dat.core.Wearables; do
              echo "::warning::JAVAP $cls"
              javap -classpath "$d/classes.jar" "$cls" 2>/dev/null | head -18 | while IFS= read -r l; do echo "::warning::  $l"; done
            done
          done
          find ~/.gradle/caches/modules-2/files-2.1/com.meta.wearable -name 'mwdat-camera*.aar' | head -1 | while read -r aar; do
            d=$(mktemp -d); unzip -q -o "$aar" classes.jar -d "$d"
            for cls in com.meta.wearable.dat.camera.Camera; do
              echo "::warning::JAVAP $cls"
              javap -classpath "$d/classes.jar" "$cls" 2>/dev/null | head -20 | while IFS= read -r l; do echo "::warning::  $l"; done
            done
          done
