name: diag (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: wasm compile, errors as annotations
        run: |
          set +e
          ./gradlew :app:wasm:wasmJsBrowserDistribution --console=plain > out.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E "^e: |^w: .*error|error:|FAILURE:|What went wrong" out.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            echo "::error::the last 12 lines follow"
            tail -12 out.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-dist
          path: app/wasm/build/dist/wasmJs/productionExecutable
          retention-days: 1
